<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="site-bg">
    <div class="site-container">
      <header>
        {{ partial "header.html" . }}
      </header>
      {{ partial "hero.html" . }}
      <main>
        <div class="main-test">
          <div class="content">
            {{ block "main" . }}{{ end }}
          </div>
          <div class="sidebar">
            {{ partial "archive.html" . }}
          </div>
        </div>
      </main>
      <footer>
        {{ partial "footer.html" . }}
      </footer>
    </div>
  </div>
  <script>
    window.BASE_URL = '{{ .Site.BaseURL }}';
  </script>
  {{ partial "scripts.html" . }}
</body>
</html>
